name: Atlas proof and evidence verification
on:
  push:
    branches: [main, atlas/bootstrap-constitution-and-registry]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hash-locked validator dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Validate exact Lean-emitted V01-V10 contract
        run: |
          lake exe emit-vectors /tmp/riv-vectors.json
          cmp /tmp/riv-vectors.json contracts/coordinate_vectors.json
          python -m json.tool /tmp/riv-vectors.json > /dev/null
      - name: Capture exact Lean axiom output for committed proof receipt
        run: |
          python scripts/audit_lean.py --check
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          log = Path('.lake/AtlasAuditRun.log').read_text()
          matches = re.findall(r"'Duodenary\\.CoordinateFrames\\.[^']+' (?:does not depend on any axioms|depends on axioms: \\[[^\\]]*\\])", log)
          lines = sorted(set(matches))
          assert len(lines) == 4, (len(lines), lines)
          proof_log = '\\n'.join(lines) + '\\n'
          print('RIV_PROOF_LOG_JSON=' + json.dumps(proof_log))
          print('RIV_PROOF_LOG_SHA256=' + hashlib.sha256(proof_log.encode()).hexdigest())
          PY
      - name: Verify source integrity and the saved research queue
        run: |
          python scripts/source_integrity.py
          python scripts/roadmap.py --check
      - name: Reproduce proof and evidence checks
        run: python scripts/reproduce.py --out .lake/ci-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-verification
          path: .lake/ci-verification
