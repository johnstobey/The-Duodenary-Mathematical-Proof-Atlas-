name: Queue snapshot freshness (CP-06)

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6h at :17 — off the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Regenerate queue snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/queue_status.py --write
      - name: Commit if snapshot drifted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadmap/QUEUE_STATUS.md
          if git diff --cached --quiet; then
            echo "snapshots current — nothing to commit"
          else
            git commit -m "chore(queue): refresh CP-06 snapshots [skip ci]"
            git push
          fi
